<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>待办事项 Todo</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #9ca3af;
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --danger: #ef4444;
    --success: #10b981;
    --border: #e5e7eb;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
    color: var(--text);
  }

  .app {
    width: 100%;
    max-width: 520px;
    align-self: flex-start;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
    color: #fff;
  }

  .header h1 {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: 1px;
  }

  .header p {
    margin-top: 6px;
    font-size: 14px;
    opacity: 0.85;
  }

  .card {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 24px;
  }

  /* 输入区 */
  .input-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .input-row input {
    flex: 1;
    padding: 12px 16px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }

  .input-row input:focus {
    border-color: var(--primary);
  }

  .btn {
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-size: 15px;
    padding: 12px 18px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-dark);
  }

  /* 筛选器 */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .filter-btn {
    flex: 1;
    padding: 8px 0;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }

  .filter-btn:hover {
    border-color: var(--primary);
    color: var(--primary);
  }

  .filter-btn.active {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
  }

  /* 列表 */
  .todo-list {
    list-style: none;
    max-height: 420px;
    overflow-y: auto;
  }

  .todo-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 8px;
    border-bottom: 1px solid var(--border);
    animation: fadeIn 0.25s ease;
  }

  .todo-item:last-child {
    border-bottom: none;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .checkbox {
    width: 22px;
    height: 22px;
    min-width: 22px;
    border: 2px solid var(--border);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition: all 0.2s;
  }

  .checkbox:hover {
    border-color: var(--success);
  }

  .checkbox.checked {
    background: var(--success);
    border-color: var(--success);
  }

  .checkbox.checked::after {
    content: "✓";
    font-size: 13px;
    font-weight: bold;
  }

  .todo-text {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    cursor: pointer;
  }

  .todo-text.completed {
    text-decoration: line-through;
    color: var(--muted);
  }

  .todo-item.editing .todo-text {
    display: none;
  }

  .edit-input {
    flex: 1;
    padding: 6px 10px;
    border: 2px solid var(--primary);
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    display: none;
  }

  .todo-item.editing .edit-input {
    display: block;
  }

  .item-actions {
    display: flex;
    gap: 6px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
    color: var(--muted);
    font-size: 15px;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    background: #f3f4f6;
  }

  .icon-btn.delete:hover {
    color: var(--danger);
    background: #fef2f2;
  }

  .icon-btn.edit:hover {
    color: var(--primary);
    background: #eef2ff;
  }

  /* 底部统计 */
  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }

  .clear-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: color 0.2s;
  }

  .clear-btn:hover {
    color: var(--danger);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 14px;
  }

  .empty .emoji {
    font-size: 40px;
    display: block;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>📝 待办事项</h1>
      <p>记录每一天要做的事</p>
    </div>

    <div class="card">
      <!-- 输入区 -->
      <div class="input-row">
        <input type="text" id="todo-input" placeholder="添加新的待办事项..." maxlength="200">
        <button class="btn btn-primary" id="add-btn">添加</button>
      </div>

      <!-- 筛选器 -->
      <div class="filters">
        <button class="filter-btn active" data-filter="all">全部</button>
        <button class="filter-btn" data-filter="active">进行中</button>
        <button class="filter-btn" data-filter="completed">已完成</button>
      </div>

      <!-- 列表 -->
      <ul class="todo-list" id="todo-list"></ul>
      <div class="empty" id="empty-state" style="display: none;">
        <span class="emoji">🎉</span>
        暂无待办事项
      </div>

      <!-- 底部统计 -->
      <div class="footer">
        <span id="count">0 项待办</span>
        <button class="clear-btn" id="clear-btn">清除已完成</button>
      </div>
    </div>
  </div>

<script>
(function () {
  // ---------- 状态 ----------
  const STORAGE_KEY = 'todo-list-data';
  let todos = loadTodos();
  let currentFilter = 'all';

  // ---------- DOM ----------
  const input = document.getElementById('todo-input');
  const addBtn = document.getElementById('add-btn');
  const listEl = document.getElementById('todo-list');
  const emptyEl = document.getElementById('empty-state');
  const countEl = document.getElementById('count');
  const clearBtn = document.getElementById('clear-btn');
  const filterBtns = document.querySelectorAll('.filter-btn');

  // ---------- 数据持久化 ----------
  function loadTodos() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveTodos() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
  }

  // ---------- 渲染 ----------
  function render() {
    const filtered = todos.filter(function (t) {
      if (currentFilter === 'active') return !t.completed;
      if (currentFilter === 'completed') return t.completed;
      return true;
    });

    listEl.innerHTML = '';

    if (filtered.length === 0) {
      emptyEl.style.display = 'block';
      emptyEl.querySelector('.emoji').textContent =
        todos.length === 0 ? '📭' : '🎉';
      emptyEl.lastChild.textContent =
        todos.length === 0 ? '暂无待办事项' : '没有符合筛选的待办';
    } else {
      emptyEl.style.display = 'none';
    }

    filtered.forEach(function (todo) {
      listEl.appendChild(createItemElement(todo));
    });

    // 统计
    const remaining = todos.filter(function (t) { return !t.completed; }).length;
    countEl.textContent = remaining + ' 项待办';
    clearBtn.style.display = todos.some(function (t) { return t.completed; })
      ? 'inline-block'
      : 'none';
  }

  function createItemElement(todo) {
    const li = document.createElement('li');
    li.className = 'todo-item';
    li.dataset.id = todo.id;

    // 复选框
    const checkbox = document.createElement('div');
    checkbox.className = 'checkbox' + (todo.completed ? ' checked' : '');
    checkbox.title = todo.completed ? '标记为未完成' : '标记为完成';
    checkbox.addEventListener('click', function () { toggleTodo(todo.id); });

    // 文本
    const text = document.createElement('span');
    text.className = 'todo-text' + (todo.completed ? ' completed' : '');
    text.textContent = todo.text;

    // 编辑输入框
    const editInput = document.createElement('input');
    editInput.type = 'text';
    editInput.className = 'edit-input';
    editInput.value = todo.text;
    editInput.maxLength = 200;

    // 操作按钮
    const actions = document.createElement('div');
    actions.className = 'item-actions';

    const editBtn = document.createElement('button');
    editBtn.className = 'icon-btn edit';
    editBtn.textContent = '✏️';
    editBtn.title = '编辑';
    editBtn.addEventListener('click', function () { startEdit(li, todo, editInput, text); });

    const delBtn = document.createElement('button');
    delBtn.className = 'icon-btn delete';
    delBtn.textContent = '🗑️';
    delBtn.title = '删除';
    delBtn.addEventListener('click', function () { deleteTodo(todo.id); });

    actions.appendChild(editBtn);
    actions.appendChild(delBtn);

    li.appendChild(checkbox);
    li.appendChild(text);
    li.appendChild(editInput);
    li.appendChild(actions);
    return li;
  }

  // ---------- 操作 ----------
  function addTodo() {
    const value = input.value.trim();
    if (!value) {
      input.focus();
      return;
    }
    todos.unshift({
      id: Date.now() + '' + Math.random().toString(36).slice(2, 6),
      text: value,
      completed: false,
      createdAt: Date.now()
    });
    input.value = '';
    input.focus();
    saveTodos();
    render();
  }

  function toggleTodo(id) {
    const todo = todos.find(function (t) { return t.id === id; });
    if (todo) {
      todo.completed = !todo.completed;
      saveTodos();
      render();
    }
  }

  function deleteTodo(id) {
    todos = todos.filter(function (t) { return t.id !== id; });
    saveTodos();
    render();
  }

  function startEdit(li, todo, editInput, text) {
    li.classList.add('editing');
    editInput.value = todo.text;
    editInput.focus();
    editInput.setSelectionRange(editInput.value.length, editInput.value.length);

    function finish(save) {
      const newValue = editInput.value.trim();
      if (save && newValue && newValue !== todo.text) {
        todo.text = newValue;
        saveTodos();
      }
      li.classList.remove('editing');
      editInput.removeEventListener('blur', onBlur);
      editInput.removeEventListener('keydown', onKeydown);
      render();
    }

    function onKeydown(e) {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    }

    function onBlur() { finish(true); }

    editInput.addEventListener('keydown', onKeydown);
    editInput.addEventListener('blur', onBlur);
  }

  function clearCompleted() {
    todos = todos.filter(function (t) { return !t.completed; });
    saveTodos();
    render();
  }

  // ---------- 事件绑定 ----------
  addBtn.addEventListener('click', addTodo);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') addTodo();
  });
  clearBtn.addEventListener('click', clearCompleted);

  filterBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      filterBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      render();
    });
  });

  // ---------- 初始化 ----------
  render();
})();
</script>
</body>
</html>
